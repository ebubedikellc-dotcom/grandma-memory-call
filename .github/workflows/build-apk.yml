name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build installable debug APK
        working-directory: android-worker
        run: gradle assembleDebug

      - name: Rename APK
        run: cp android-worker/app/build/outputs/apk/debug/app-debug.apk Grandma-Memory-Worker.apk

      - name: Save workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grandma-Memory-Worker-APK
          path: Grandma-Memory-Worker.apk

      - name: Publish or update APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-worker-latest >/dev/null 2>&1 || \
            gh release create android-worker-latest --title "Grandma Memory Worker APK" --notes "Install this APK on the Android phone that has WhatsApp."
          gh release upload android-worker-latest Grandma-Memory-Worker.apk --clobber
